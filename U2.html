<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>[U] Secure Package</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;background:#008080;font-family:"MS Sans Serif",Tahoma,sans-serif;color:#000}
    .wrap{min-height:100vh;display:grid;place-items:center}
    .window{background:#C0C0C0;border:2px solid #000;box-shadow:2px 2px 0 #fff,-2px -2px 0 #000;width:520px;max-width:90vw}
    .titlebar{background:#000080;color:#fff;padding:4px 8px;font-weight:bold}
    .content{padding:12px;text-align:center}
    .hint{font-size:10pt;margin:8px 0 14px}
    .tile{display:inline-flex;flex-direction:column;align-items:center;gap:8px;user-select:none}
    .icon-wrap{border:2px solid #000;box-shadow:1px 1px 0 #fff inset,-1px -1px 0 #7d7d7d inset,2px 2px 0 #1a1a1a;background:#c0c0c0;padding:10px;transition:transform .05s}
    .icon-wrap:active{transform:translate(1px,1px)}
    .folder-svg{display:block;width:96px;height:72px;image-rendering:pixelated}
    .label{font-size:10pt;background:#000;color:#fff;border:1px solid #333;padding:2px 6px}
    .btn{display:inline-block;margin-top:10px;padding:4px 12px;background:#C0C0C0;border:2px outset #fff;cursor:pointer}
    .btn:active{border-style:inset}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="window">
      <div class="titlebar">[U] Delivery Node</div>
      <div class="content">
        <div class="hint">Your package should begin downloading automatically. If not, click the folder:</div>

        <!-- Win98-style folder tile (manual fallback & also a normal download) -->
        <a id="manualLink" class="tile" href="CHUDTOPIA X-0.9.8.zip" download="CHUDTOPIA X-1.0.zip">
          <div class="icon-wrap" title="Download ZIP">
            <svg class="folder-svg" viewBox="0 0 64 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Windows 98 folder icon">
              <rect x="1" y="9" width="62" height="36" fill="#d6c289" stroke="#000" stroke-width="2"/>
              <path d="M8 9 h18 l4 -6 h14 v10 H8 Z" fill="#e2ce92" stroke="#000" stroke-width="2"/>
              <rect x="4" y="12" width="56" height="30" fill="#c9b378"/>
              <rect x="3" y="10" width="58" height="2" fill="#fff" opacity=".6"/>
              <rect x="3" y="44" width="58" height="1" fill="#7a6a3f" opacity=".9"/>
            </svg>
          </div>
          <div class="label">CHUDTOPIA X.zip</div>
        </a>

        <div>
          <button class="btn" onclick="history.back()">Back</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Auto-trigger download on load (same-origin ZIP recommended)
    (function(){
      const zipPath = 'CHUDTOPIA X-1.0.zip';      // <-- change if needed
      const fileName = 'CHUDTOPIA X-1.0.zip';   // <-- change if needed

      // Prefer native anchor with download attribute to keep behavior consistent.
      const a = document.createElement('a');
      a.href = zipPath;
      a.download = fileName;
      // For some browsers, the element must be in the DOM for a click to register.
      document.body.appendChild(a);
      // Small timeout improves reliability after navigation
      setTimeout(() => { a.click(); a.remove(); }, 50);
    })();
  </script>
</body>
</html>
