<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 900px;
    }

    .background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .dark-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      z-index: 1;
      pointer-events: none;
    }

    .download-icon {
      position: absolute;
      left: 50%;
      top: 58%;
      z-index: 2;
      width: 120px;
      height: 140px;
      transform: translate(-50%, -50%) translateZ(-1400px) scale(0.08);
      opacity: 0;
      text-decoration: none;
      color: #111;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
      transition: filter 0.2s ease, transform 0.08s linear, opacity 0.08s linear;
    }

    .download-icon:hover {
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.9));
    }

    .file-shape {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
      border: 4px solid #222;
      border-radius: 10px;
      overflow: hidden;
    }

    .file-shape::before {
      content: "";
      position: absolute;
      right: -4px;
      top: -4px;
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #c7c7c7 0%, #f7f7f7 55%, #ffffff 100%);
      border-left: 4px solid #222;
      border-bottom: 4px solid #222;
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }

    .zip-label {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 6px 11px;
      color: #fff;
      background: #222;
      border-radius: 6px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .download-text {
      position: absolute;
      left: 50%;
      top: calc(58% + 95px);
      z-index: 3;
      transform: translateX(-50%);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .download-text.visible {
      opacity: 1;
    }

    .fallback-message {
      position: absolute;
      left: 50%;
      bottom: 24px;
      z-index: 4;
      transform: translateX(-50%);
      color: white;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- Replace video.mp4 with your actual video file path. -->
    <video
      id="backgroundVideo"
      class="background-video"
      src="krab.mp4"
      autoplay
      playsinline
    ></video>

    <div class="dark-overlay"></div>

    <!-- Replace destination.html with the page or URL you want users to visit. -->
    <a
      id="downloadIcon"
      class="download-icon"
      href="U2.html"
      aria-label="Open linked file"
      title="Open File"
    >
      <div class="file-shape">
        <span class="zip-label">FILE</span>
      </div>
    </a>

    <div id="downloadText" class="download-text">Click to continue</div>
    <div id="fallbackMessage" class="fallback-message">Click anywhere to start the video</div>
  </main>

  <script>
    const video = document.getElementById("backgroundVideo");
    const downloadIcon = document.getElementById("downloadIcon");
    const downloadText = document.getElementById("downloadText");
    const fallbackMessage = document.getElementById("fallbackMessage");

    // Adjust these to control when the file icon appears.
    // 0.0 = start of video, 1.0 = end of video.
    const appearStart = 0.38;
    const fullyVisibleAt = 0.72;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function updateIconFromVideoProgress() {
      if (!video.duration || Number.isNaN(video.duration)) return;

      const progress = video.currentTime / video.duration;
      const entranceProgress = clamp(
        (progress - appearStart) / (fullyVisibleAt - appearStart),
        0,
        1
      );

      // Smooth the movement so it feels like it is approaching from far away.
      const eased = 1 - Math.pow(1 - entranceProgress, 3);

      // The icon begins tiny in the center, far back in 3D space,
      // then slowly moves toward the viewer until it reaches full size.
      const scale = 0.08 + eased * 0.92;
      const depth = -1400 + eased * 1400;
      const opacity = clamp(entranceProgress * 1.4, 0, 1);

      downloadIcon.style.opacity = opacity;
      downloadIcon.style.transform = `translate(-50%, -50%) translateZ(${depth}px) scale(${scale})`;

      if (progress >= fullyVisibleAt) {
        downloadText.classList.add("visible");
        downloadIcon.style.pointerEvents = "auto";
      } else {
        downloadText.classList.remove("visible");
        downloadIcon.style.pointerEvents = "none";
      }

      requestAnimationFrame(updateIconFromVideoProgress);
    }

    video.addEventListener("play", () => {
      fallbackMessage.style.display = "none";
      requestAnimationFrame(updateIconFromVideoProgress);
    });

    video.addEventListener("ended", () => {
      // Keep the icon fully visible once the video ends.
      downloadIcon.style.opacity = 1;
      downloadIcon.style.transform = "translate(-50%, -50%) scale(1)";
      downloadIcon.style.pointerEvents = "auto";
      downloadText.classList.add("visible");
    });

    // Browser autoplay fallback.
    video.play().catch(() => {
      fallbackMessage.style.display = "block";
      document.body.addEventListener(
        "click",
        () => {
          video.play();
        },
        { once: true }
      );
    });
  </script>
</body>
</html>
