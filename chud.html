<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      perspective: 900px;
    }

    .background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .dark-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      z-index: 1;
      pointer-events: none;
    }

    .download-icon {
      position: absolute;
      left: 45%;
      top: 45%;
      z-index: 2;
      width: 120px;
      height: 140px;
      transform: translate(-50%, -50%) scale(0.01);
      opacity: 0;
      text-decoration: none;
      color: #111;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
      transition: filter 0.2s ease, transform 0.08s linear, opacity 0.08s linear;
    }

    .download-icon:hover {
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.9));
    }

    .file-shape {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
      border: 4px solid #222;
      border-radius: 10px;
      overflow: hidden;
    }

    .file-shape::before {
      content: "";
      position: absolute;
      right: -4px;
      top: -4px;
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #c7c7c7 0%, #f7f7f7 55%, #ffffff 100%);
      border-left: 4px solid #222;
      border-bottom: 4px solid #222;
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }

    .zip-label {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 6px 11px;
      color: #fff;
      background: #222;
      border-radius: 6px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .download-text {
      position: absolute;
      left: 45%;
      top: calc(45% + 95px);
      z-index: 3;
      transform: translateX(-50%);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .download-text.visible {
      opacity: 1;
    }

    .fallback-message {
      position: absolute;
      left: 50%;
      bottom: 24px;
      z-index: 4;
      transform: translateX(-50%);
      color: white;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      display: none;
    }

    .start-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }

    .start-button {
      padding: 16px 28px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #111;
      background: white;
      border: 3px solid #111;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .start-button:hover {
      transform: scale(1.04);
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- Replace video.mp4 with your actual video file path. -->
    <video
      id="backgroundVideo"
      class="background-video"
      src="krab.mp4"
      controls
      playsinline
    ></video>

    <div class="dark-overlay"></div>

    <!-- Replace destination.html with the page or URL you want users to visit. -->
    <a
      id="downloadIcon"
      class="download-icon"
      href="U2.html"
      aria-label="Open linked file"
      title="Open File"
    >
      <!-- Replace fileicon.png with your own PNG file. -->
      <img
        class="file-image"
        src="chud-logo.png"
        alt="File Icon"
      />
    </a>

    <div id="downloadText" class="download-text">Click to continue</div>
    <div id="fallbackMessage" class="fallback-message">Click Start to play with audio</div>

    <div id="startOverlay" class="start-overlay">
      <button id="startButton" class="start-button">Start Video</button>
    </div>
  </main>

  <script>
    const video = document.getElementById("backgroundVideo");
    const downloadIcon = document.getElementById("downloadIcon");
    const downloadText = document.getElementById("downloadText");
    const fallbackMessage = document.getElementById("fallbackMessage");
    const startOverlay = document.getElementById("startOverlay");
    const startButton = document.getElementById("startButton");

    // Adjust these to control when the file icon approaches the viewer.
    // 0.0 = start of video, 1.0 = end of video.
    const appearStart = 0.02;
    const fullyVisibleAt = 0.96;

    // Final size. Increase this if it still feels smaller than the sandwich.
    const finalScale = 4.5;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function updateIconFromVideoProgress() {
      if (!video.duration || Number.isNaN(video.duration)) return;

      const progress = video.currentTime / video.duration;
      const entranceProgress = clamp(
        (progress - appearStart) / (fullyVisibleAt - appearStart),
        0,
        1
      );

      // Use a slower easing curve so the icon starts extremely small,
      // then creeps forward before becoming very large near the viewer.
      const eased = Math.pow(entranceProgress, 2.0);

      const startScale = 0.01;
      const scale = startScale + eased * (finalScale - startScale);
      const opacity = clamp(entranceProgress * 2.0, 0, 1);

      downloadIcon.style.opacity = opacity;
      downloadIcon.style.transform = `translate(-50%, -50%) scale(${scale})`;

      if (progress >= fullyVisibleAt) {
        downloadText.classList.add("visible");
        downloadIcon.style.pointerEvents = "auto";
      } else {
        downloadText.classList.remove("visible");
        downloadIcon.style.pointerEvents = "none";
      }

      requestAnimationFrame(updateIconFromVideoProgress);
    }

    video.addEventListener("play", () => {
      fallbackMessage.style.display = "none";
      startOverlay.style.display = "none";
      requestAnimationFrame(updateIconFromVideoProgress);
    });

    video.addEventListener("ended", () => {
      // Keep the icon fully visible once the video ends.
      downloadIcon.style.opacity = 1;
      downloadIcon.style.transform = "translate(-50%, -50%) scale(1)";
      downloadIcon.style.pointerEvents = "auto";
      downloadText.classList.add("visible");
    });

    // Browsers usually block autoplay with sound, so the user must start it.
    startButton.addEventListener("click", () => {
      video.muted = false;
      video.volume = 1;
      video.play();
    });
  </script>
</body>
</html>
